<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="robots"
          content="{% block robots %}noindex, nofollow{% endblock %}">

    <title>{% block title %}School Management System{% endblock %}</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body>

    <div class="d-flex">

        <!-- Sidebar -->

        <div class="bg-dark text-white p-3"
             style="width:250px;height:100vh;">

            <h3>School Management</h3>

            <hr>

            <a href="/dashboard/"
               class="text-white d-block mb-3 text-decoration-none">
                Dashboard
            </a>

            <a href="/students/"
               class="text-white d-block mb-3 text-decoration-none">
                View Students
            </a>

            <a href="/add/"
               class="text-white d-block text-decoration-none">
                Add Student
            </a>

            <a href="/class-list/"
               class="text-white d-block mt-3 text-decoration-none">
                Class Students
            </a>

        </div>

        <!-- Main content -->

        <div class="container p-4">

            {% block content %}
            {% endblock %}

        </div>

    </div>

</body>

</html>
