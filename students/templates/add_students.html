{% extends 'base.html' %}

{% block content %}

<h2>Add Student</h2>

<form method="POST">

{% csrf_token %}

<label>Name *</label>
<input
type="text"
name="name"
class="form-control mb-3"
required>


<label>Roll Number *</label>
<input
type="number"
name="roll_no"
class="form-control mb-3"
required>


<label>Age *</label>
<input
type="number"
name="age"
class="form-control mb-3"
required>


<label>Class *</label>

<select
name="student_class"
class="form-control mb-3"
required>

<option value="">
Select Class
</option>

<option value="6th">
6th
</option>

<option value="7th">
7th
</option>

<option value="8th">
8th
</option>

<option value="9th">
9th
</option>

<option value="10th">
10th
</option>

</select>

<label>Email *</label>
<input
type="email"
name="email"
class="form-control mb-3"
required>


<label>Address *</label>
<textarea
name="address"
class="form-control mb-3"
required>
</textarea>


<button class="btn btn-success">

Save Student

</button>

</form>

{% endblock %}
