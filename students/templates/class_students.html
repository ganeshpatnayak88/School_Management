{% extends 'base.html' %}

{% block content %}

<h2 class="mb-4">

{{class_name}} Class Students

</h2>

<table class="table table-bordered table-hover">

<thead class="table-dark">

<tr>

<th>ID</th>
<th>Name</th>
<th>Roll No</th>
<th>Age</th>
<th>Class</th>
<th>Email</th>

</tr>

</thead>

<tbody>

{% for s in students %}

<tr>

<td>{{s.id}}</td>

<td>{{s.name}}</td>

<td>{{s.roll_no}}</td>

<td>{{s.age}}</td>

<td>{{s.student_class}}</td>

<td>{{s.email}}</td>

</tr>

{% empty %}

<tr>

<td colspan="6"
class="text-center">

No students found

</td>

</tr>

{% endfor %}

</tbody>

</table>

<a href="/"
class="btn btn-secondary">

Back Dashboard

</a>

{% endblock %}
